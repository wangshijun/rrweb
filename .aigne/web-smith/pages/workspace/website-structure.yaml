- title: Home
  description: A comprehensive single-page documentation site for rrweb, a tool
    for recording and replaying web sessions. This page serves as a complete
    guide for developers, starting with a high-level introduction and a live
    demo link. It details key use cases like bug reproduction and user analysis
    (#UseCases), followed by a practical quick start guide for implementation
    (#GettingStarted). The page then offers a deep dive into rrweb's internal
    design, explaining its serialization, incremental snapshot, replay, and
    sandboxing mechanisms (#HowItWorks). An extensive 'Recipes' section covers
    advanced usage for specific scenarios like live replay, canvas recording,
    plugin integration, and storage optimization (#AdvancedUsage). Finally, it
    provides information on how to contribute to the project, and showcases
    community sponsors and users (#Community).
  path: /home
