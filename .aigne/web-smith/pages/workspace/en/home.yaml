"meta":
  "title": "rrweb: The Open-Source Session Replay Library"
  "description": "Record and replay web sessions with pixel-perfect accuracy.
    Understand user behavior, debug faster, and improve your product with rrweb,
    the leading open-source tool for session replay."
  "image": ""
"sections":
  - "sectionName": "hero"
    "sectionSummary": "A powerful, developer-focused hero section that immediately
      introduces rrweb's core function and provides clear calls-to-action to try
      the demo or view the source code."
    "heroTitle": "Record and Replay the Web"
    "heroDescription": "rrweb is a powerful open-source tool for recording and
      replaying users' interactions on your web application. See exactly what
      your users see and revolutionize your debugging and user analysis."
    "sectionBackground": "linear-gradient(to right, #232526, #414345)"
    "actions":
      - "text": "Try the Live Demo"
        "link": "https://www.rrweb.io/"
      - "text": "View on GitHub"
        "link": "https://github.com/rrweb-io/rrweb"
  - "sectionName": "useCases"
    "sectionSummary": "This section showcases the top-tier use cases for rrweb,
      focusing on debugging, user analytics, and support to demonstrate its
      immediate value to development and product teams."
    "title": "Unlock Powerful Insights with Session Replay"
    "description": "Go beyond traditional analytics and see your application through
      your users' eyes. Here’s how you can leverage rrweb to build better
      products, faster."
    "list":
      - "sectionName": "bugReproduction"
        "sectionSummary": "Details the use case of bug reproduction and debugging."
        "cardTitle": "Bug Reproduction and Debugging"
        "cardDescription": "Capture the exact conditions and interactions that lead to a
          bug. Developers can replay the session to observe the issue firsthand,
          inspect the DOM at any point in time, and debug with complete context.
          This eliminates the 'it works on my machine' problem and dramatically
          reduces the time spent on issue replication."
        "iconifyIconName": "lucide:bug"
      - "sectionName": "userBehaviorAnalysis"
        "sectionSummary": "Details the use case of analyzing user behavior."
        "cardTitle": "User Behavior Analysis"
        "cardDescription": "Gain qualitative insights into how users interact with your
          application. Session replays allow product managers and UX designers
          to watch actual user journeys, identify points of friction, discover
          usability issues, and understand behavior in a way that quantitative
          analytics alone cannot provide."
        "iconifyIconName": "lucide:line-chart"
      - "sectionName": "customerSupport"
        "sectionSummary": "Details the use case of customer support and co-browsing."
        "cardTitle": "Customer Support and Co-browsing"
        "cardDescription": "Power real-time customer support by viewing a user's session
          live (with sensitive data masked). Support agents can provide
          accurate, contextual guidance without guesswork, leading to faster
          resolutions and a better customer experience. This is often referred
          to as 'co-browsing.'"
        "iconifyIconName": "lucide:users"
      - "sectionName": "productDemos"
        "sectionSummary": "Details the use case of creating product demos and training."
        "cardTitle": "Creating Product Demos and Training"
        "cardDescription": "Generate high-fidelity, interactive product tours and
          tutorials from recorded sessions. Instead of creating mock-ups, you
          can use real application interactions to create realistic and
          effective onboarding materials or marketing demos."
        "iconifyIconName": "lucide:video"
      - "sectionName": "automatedTesting"
        "sectionSummary": "Details the use case of automated testing."
        "cardTitle": "Automated Testing"
        "cardDescription": "Accelerate the creation of end-to-end tests by converting
          recorded user sessions into automated test scripts. This helps capture
          complex user flows and edge cases that are difficult to script
          manually, thereby improving test coverage and reliability."
        "iconifyIconName": "lucide:bot"
      - "sectionName": "complianceAuditing"
        "sectionSummary": "Details the use case of compliance and auditing."
        "cardTitle": "Compliance and Auditing"
        "cardDescription": "Maintain a detailed, replayable audit trail of user activity
          for compliance and security purposes. In regulated industries like
          finance or healthcare, session replays provide a verifiable record of
          user actions within the application."
        "iconifyIconName": "lucide:shield-check"
  - "sectionName": "howItWorks"
    "sectionSummary": "Explains the core technical concepts behind rrweb in an
      accessible way, building confidence and providing a high-level
      architectural overview for technical users."
    "title": "The Magic Behind the Curtain"
    "description": "rrweb is built on a foundation of clever browser APIs and a
      smart data structure. Here's a glimpse into its core components."
    "list":
      - "sectionName": "serialization"
        "sectionSummary": "Explains the serialization process."
        "cardTitle": "DOM Serialization"
        "cardDescription": "rrweb converts the DOM and its state into a serializable
          data structure, capturing everything needed to rebuild the page
          perfectly, including tricky states like input values."
        "iconifyIconName": "mdi:code-braces"
      - "sectionName": "incrementalSnapshots"
        "sectionSummary": "Explains incremental snapshots."
        "cardTitle": "Incremental Snapshots"
        "cardDescription": "After the initial snapshot, rrweb records only the changes
          (mutations, interactions, scrolls) as a stream of events, making
          recordings incredibly efficient and lightweight."
        "iconifyIconName": "mdi:camera-plus-outline"
      - "sectionName": "replayEngine"
        "sectionSummary": "Explains the replay process."
        "cardTitle": "High-Fidelity Replay"
        "cardDescription": "The replayer reconstructs the initial DOM and then applies
          each incremental snapshot in sequence with a high-precision timer,
          creating a pixel-perfect recreation of the user's session."
        "iconifyIconName": "mdi:play-box-outline"
      - "sectionName": "secureSandbox"
        "sectionSummary": "Explains the security sandbox."
        "cardTitle": "Secure Sandbox"
        "cardDescription": "Replays happen inside a sandboxed iframe, disabling all
          script execution to prevent any potential security risks and ensure
          the replay environment is completely isolated and safe."
        "iconifyIconName": "mdi:shield-lock-outline"
  - "sectionName": "advancedRecipes"
    "sectionSummary": "Highlights key advanced features and plugins, showing
      developers the flexibility and power of rrweb for more complex or
      specialized scenarios."
    "title": "Advanced Recipes for Powerful Scenarios"
    "description": "Take rrweb to the next level with powerful features for
      real-time streaming, complex element recording, and performance
      optimization."
    "list":
      - "sectionName": "liveReplay"
        "sectionSummary": "Introduces the live replay feature."
        "cardTitle": "Real-time Replay (Live Mode)"
        "cardDescription": "Stream user sessions live! Perfect for real-time
          collaboration, co-browsing, and immediate customer support scenarios.
          It's like looking over your user's shoulder, virtually."
        "iconifyIconName": "mdi:broadcast"
      - "sectionName": "canvasRecording"
        "sectionSummary": "Introduces canvas recording capabilities."
        "cardTitle": "Canvas Recording"
        "cardDescription": "Capture complex visualizations, games, or editor interfaces.
          rrweb can record canvas elements as image snapshots or stream them via
          WebRTC for a complete picture of the user's interaction."
        "iconifyIconName": "mdi:palette-outline"
      - "sectionName": "pluginArchitecture"
        "sectionSummary": "Introduces the plugin system."
        "cardTitle": "Extensible Plugin Architecture"
        "cardDescription": "Keep the core light and extend functionality as needed. With
          plugins, you can record console logs, network requests, and more,
          tailoring rrweb to your exact needs."
        "iconifyIconName": "mdi:puzzle-outline"
      - "sectionName": "storageOptimization"
        "sectionSummary": "Introduces storage optimization techniques."
        "cardTitle": "Storage Optimization"
        "cardDescription": "Manage data volume effectively. Use sampling to reduce event
          frequency, block sensitive or noisy elements, and apply compression to
          keep storage costs down."
        "iconifyIconName": "mdi:database-cog-outline"
  - "sectionName": "community"
    "sectionSummary": "Celebrates the open-source community, encourages
      contributions, and showcases social proof through sponsors, fostering a
      sense of collaboration and trust."
    "title": "Built by the Community, for the Community"
    "description": "rrweb is a thriving open-source project thanks to our
      contributors, sponsors, and users. Get involved and help shape the future
      of session replay."
    "list":
      - "sectionName": "contribute"
        "sectionSummary": "Call to action for contributing on GitHub."
        "cardTitle": "Contribute on GitHub"
        "cardDescription": "Have an idea or a bug fix? We welcome pull requests! Check
          out our contribution guide to get started."
        "iconifyIconName": "mdi:github"
      - "sectionName": "slackChannel"
        "sectionSummary": "Call to action for joining the Slack community."
        "cardTitle": "Join our Slack Channel"
        "cardDescription": "Connect with other rrweb users and the core team. Ask
          questions, share your projects, and get support from the community."
        "iconifyIconName": "mdi:slack"
      - "sectionName": "becomeSponsor"
        "sectionSummary": "Call to action for becoming a sponsor."
        "cardTitle": "Become a Sponsor"
        "cardDescription": "Support the project's development and get your logo
          featured. Your sponsorship helps keep rrweb maintained and
          innovative."
        "iconifyIconName": "mdi:heart-outline"
    "action":
      "text": "View on GitHub"
      "link": "https://github.com/rrweb-io/rrweb"
  - "sectionName": "finalCta"
    "sectionSummary": "A final, energetic call-to-action that encourages immediate
      engagement by providing clear next steps for both trying out the tool and
      exploring the source code."
    "title": "Start Recording Today"
    "description": "Integrate rrweb into your stack and start seeing your
      application through your users' eyes. It's time to build better, more
      intuitive user experiences."
    "ctaBackground": "primary.main"
    "ctaActions":
      - "text": "Try the Live Demo"
        "link": "https://www.rrweb.io/"
      - "text": "Explore the Docs"
        "link": "https://github.com/rrweb-io/rrweb/tree/master/guide.md"
