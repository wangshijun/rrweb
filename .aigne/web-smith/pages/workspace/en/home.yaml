meta:
  title: "rrweb: Open-source Web Session Replay"
  description: "Record and replay every web interaction with pixel-perfect accuracy. rrweb is the open-source tool for developers to understand user behavior, debug faster, and build better products."
sections:
  - sectionName: "Hero"
    sectionSummary: "An energetic and welcoming introduction to rrweb, immediately establishing its core value proposition: recording and replaying web sessions. This section aims to capture attention with a clear benefit-driven headline and provide immediate next steps with prominent calls-to-action."
    splitHeroTitle: "See Your Web App Through Your Users' Eyes"
    splitHeroDescription: "rrweb is the open-source powerhouse for recording and replaying web interactions with pixel-perfect fidelity. Stop guessing and start seeing exactly what your users experience to debug faster and build amazing products."
    splitHeroActions:
      - text: "Try it now!"
        link: "https://www.rrweb.io/"
      - text: "View on GitHub"
        link: "https://github.com/rrweb-io/rrweb"
    splitHeroRightImage: "https://placehold.co/800x600?text=rrweb+in+Action"
  - sectionName: "SocialProof"
    sectionSummary: "Builds immediate credibility by showcasing prominent companies and projects that trust and use rrweb. This logo wall serves as powerful social proof, assuring new users that rrweb is a reliable and widely-adopted solution."
    logoWallTitle: "Trusted by Leading Tech Companies"
    logoWallList:
      - image: "https://www.rrweb.io/logos/smartx.png"
        link: "http://www.smartx.com/"
      - image: "https://www.rrweb.io/logos/posthog.png"
        link: "https://posthog.com?utm_source=rrweb&utm_medium=sponsorship&utm_campaign=open-source-sponsorship"
      - image: "https://statcounter.com/images/logo-statcounter-arc-blue.svg"
        link: "https://statcounter.com/session-replay/"
      - image: "https://uploads-ssl.webflow.com/5f3d133183156245630d4446/5f3d1940abe8db8612c23521_Record-Once-logo-554x80px.svg"
        link: "https://recordonce.com/"
      - image: "https://cux.io/cux-logo.svg"
        link: "https://cux.io"
      - image: "https://github.com/highlight/highlight/raw/main/highlight.io/public/images/logo.png"
        link: "https://highlight.io"
      - image: "https://github.com/requestly/requestly/assets/16779465/652552db-c867-44cb-9bb5-94a2026e04ca"
        link: "https://requestly.io"
      - image: "https://assets-global.website-files.com/6506f3f29c68b1724807619d/6506f56010237164c6306591_GleapLogo.svg"
        link: "https://gleap.io"
      - image: "https://github.com/UXWizz/public-files/raw/main/assets/logo.png"
        link: "https://uxwizz.com"
  - sectionName: "HowItWorks"
    sectionSummary: "Breaks down rrweb's core technical concepts into easily digestible parts. This section targets the developer audience by explaining the 'magic' behind the tool, building confidence in its architecture and capabilities."
    fourColumnGridTitle: "How the Magic Happens: The Core of rrweb"
    list:
      - sectionName: "Serialization"
        sectionSummary: "Explains how rrweb converts the DOM into a transmittable data structure, including special handling for scripts, input values, and styles."
        iconName: "mdi:code-json"
        cardTitle: "DOM Serialization"
        cardDescription: "We convert the entire DOM into a serializable JSON format, capturing everything from input values to CSS rules, while safely de-scripting to ensure a secure replay."
      - sectionName: "IncrementalSnapshots"
        sectionSummary: "Details the use of MutationObserver to capture all DOM changes, mouse movements, and interactions efficiently."
        iconName: "mdi:camera-iris"
        cardTitle: "Incremental Snapshots"
        cardDescription: "Using the power of MutationObserver, rrweb records every single change—DOM mutations, mouse movements, and user inputs—as a lightweight incremental event."
      - sectionName: "ReplayEngine"
        sectionSummary: "Describes the replay process, highlighting the high-precision timer and the sandboxed environment for accurate and secure playback."
        iconName: "mdi:play-box-outline"
        cardTitle: "Pixel-Perfect Replay"
        cardDescription: "Our high-precision timer reconstructs events in a secure iframe sandbox, replaying user sessions exactly as they happened, right down to hover states and window resizing."
      - sectionName: "SandboxSecurity"
        sectionSummary: "Focuses on the security aspect, explaining how rrweb uses a sandboxed iframe to prevent script execution and protect user data during replay."
        iconName: "mdi:shield-lock-outline"
        cardTitle: "Sandbox for Security"
        cardDescription: "Every replay happens inside a secure iframe sandbox, which blocks scripts and form submissions, ensuring that replaying a session is always safe and predictable."
  - sectionName: "GettingStarted"
    sectionSummary: "Provides a clear, action-oriented guide to get developers started with rrweb immediately. This section presents minimal, essential code snippets for recording and replaying to lower the barrier to entry."
    twoColumnGridTitle: "Get Started in Minutes"
    list:
      - sectionName: "RecordSession"
        sectionSummary: "A card showing the code to start recording a user session."
        contentCardTitle: "1. Record a Session"
        contentCardDescription: "Just add a few lines of code to your application. rrweb will start capturing all interactions and mutations, which you can then send to your storage of choice."
        contentCardRightCode:
          name: "record.js"
          content: "import { record } from 'rrweb';\n\n// `events` will be an array of events.\nlet events = [];\n\n// stop recording\nconst stopFn = record({\n  emit(event) {\n    // push event into the events array\n    events.push(event);\n  },\n});"
      - sectionName: "ReplaySession"
        sectionSummary: "A card showing the code to replay a recorded session."
        contentCardTitle: "2. Replay It Anywhere"
        contentCardDescription: "Take your recorded events and feed them into the replayer. You can embed the replayer in your dashboard to watch sessions back instantly."
        contentCardRightCode:
          name: "replay.js"
          content: "import { Replayer } from 'rrweb';\n\n// `events` is the array of events captured by `record`\n\nconst replayer = new Replayer(events);\n\n// play the events\nreplayer.play();"
  - sectionName: "AdvancedUseCases"
    sectionSummary: "Showcases the versatility and power of rrweb by highlighting advanced features and use cases. This section inspires developers with what's possible, from real-time streaming to performance optimization."
    threeColumnGridTitle: "Unlock Powerful Use Cases"
    list:
      - sectionName: "LiveMode"
        sectionSummary: "Highlights the real-time replay capability for live support or collaboration."
        iconName: "mdi:broadcast"
        cardTitle: "Live Mode & Co-browsing"
        cardDescription: "Stream user sessions in real-time for live customer support, collaborative browsing, or application monitoring. It's like you're sitting right next to them!"
      - sectionName: "StorageOptimization"
        sectionSummary: "Explains how to optimize storage costs with sampling and compression."
        iconName: "mdi:zip-box-outline"
        cardTitle: "Storage Optimization"
        cardDescription: "Keep your data lean. Use event sampling, our packer for compression, or server-side deduplication to dramatically reduce storage size and costs."
      - sectionName: "ExtensiblePlugins"
        sectionSummary: "Introduces the plugin ecosystem for extending rrweb's functionality."
        iconName: "mdi:puzzle-outline"
        cardTitle: "Extensible via Plugins"
        cardDescription: "Need more? Extend rrweb's core functionality with plugins. Record console logs, canvas interactions via WebRTC, and more with our powerful plugin API."
      - sectionName: "CanvasRecording"
        sectionSummary: "Details how to record dynamic canvas elements."
        iconName: "mdi:palette-outline"
        cardTitle: "Canvas Recording"
        cardDescription: "Capture rich, interactive experiences from `<canvas>` elements. Perfect for recording product tours, games, or complex data visualizations."
      - sectionName: "ConsoleLogs"
        sectionSummary: "Explains how to record and replay browser console logs for easier debugging."
        iconName: "mdi:console-line"
        cardTitle: "Console Log Replay"
        cardDescription: "Debug issues faster by seeing the full context. The console plugin records every `console.log`, `warn`, and `error` alongside user actions."
      - sectionName: "CustomEvents"
        sectionSummary: "Shows how developers can inject their own custom events into the recording."
        iconName: "mdi:tag-plus-outline"
        cardTitle: "Custom Event Tracking"
        cardDescription: "Enrich your recordings with your own application-specific data. Add custom events to mark key user milestones or track internal state changes."
  - sectionName: "Contribution"
    sectionSummary: "A warm and energetic invitation for developers to join the rrweb community. This section provides clear calls-to-action for contributing to the project and engaging with other members."
    ctaTitle: "Join Our Awesome Community!"
    ctaDescription: "rrweb is built by developers, for developers. Whether you want to contribute code, report a bug, or just chat with the team, we'd love to have you!"
    cta:
      - text: "Contribute on GitHub"
        link: "https://github.com/rrweb-io/rrweb"
      - text: "Join our Slack"
        link: "https://join.slack.com/t/rrweb/shared_invite/zt-siwoc6hx-uWay3s2wyG8t5GpZVb8rWg"
