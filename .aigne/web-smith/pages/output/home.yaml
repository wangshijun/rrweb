        a7frn5jmx5vpxpt3:
          value: |-
            import { record } from 'rrweb';

            // `events` will be an array of events.
            let events = [];

            // stop recording
            const stopFn = record({
              emit(event) {
                // push event into the events array
                events.push(event);
              },
            });
