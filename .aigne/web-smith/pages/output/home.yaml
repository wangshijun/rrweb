          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1758789736331-y7vkch80n
                type: text
                text: rrweb is built on a foundation of clever browser APIs and a smart data
                  structure. Here's a glimpse into its core components.
                style:
                  color: ""
                  fontSize: 16px
                  variant: body1
  9076f811740b4112:
