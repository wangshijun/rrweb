    en:
      properties:
        gs1rn5jmxfvpxptx:
          value:
            text: Bug Reproduction and Debugging
            style:
              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: Capture the exact conditions and interactions that lead to a bug.
                  Developers can replay the session to observe the issue
                  firsthand, inspect the DOM at any point in time, and debug
                  with complete context. This eliminates the 'it works on my
                  machine' problem and dramatically reduces the time spent on
                  issue replication.
                style:
                  color: ""
                  fontSize: 16px
                  variant: body1
        v5utpm7bu9yvdpnq:
          value: flex-start
        kyg0hdy5uqq4gc1o:
          value: flex-start
  d623545c67c0bae5:
