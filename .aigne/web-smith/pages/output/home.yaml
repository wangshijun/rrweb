              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: After the initial snapshot, rrweb records only the changes (mutations,
                  interactions, scrolls) as a stream of events, making
                  recordings incredibly efficient and lightweight.
