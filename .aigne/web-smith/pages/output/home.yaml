          value: lucide:bug
        529qbwiam7oypw8e:
          value: 40px
        gugqsxx3xyveuu8n:
          value: primary.main
  60669633b69c613c:
    en:
      properties:
        gs1rn5jmxfvpxptx:
          value:
            text: User Behavior Analysis
            style:
              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: Gain qualitative insights into how users interact with your application.
                  Session replays allow product managers and UX designers to
                  watch actual user journeys, identify points of friction,
                  discover usability issues, and understand behavior in a way
                  that quantitative analytics alone cannot provide.
                style:
                  color: ""
                  fontSize: 16px
                  variant: body1
        v5utpm7bu9yvdpnq:
          value: flex-start
        kyg0hdy5uqq4gc1o:
          value: flex-start
