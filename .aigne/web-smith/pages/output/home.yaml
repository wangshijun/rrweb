            list:
              - id: item-1754042380003-mnbkkn5fa
                type: text
                text: >
                  rrweb is a powerful open-source tool for recording and
                  replaying users' interactions on your web application. See
                  exactly what your users see and revolutionize your debugging
                  and user analysis.
