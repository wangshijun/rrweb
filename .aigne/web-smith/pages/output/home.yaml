          value:
            text: Compliance and Auditing
            style:
              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: Maintain a detailed, replayable audit trail of user activity for
                  compliance and security purposes. In regulated industries like
                  finance or healthcare, session replays provide a verifiable
                  record of user actions within the application.
