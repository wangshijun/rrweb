        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: The replayer reconstructs the initial DOM and then applies each
                  incremental snapshot in sequence with a high-precision timer,
