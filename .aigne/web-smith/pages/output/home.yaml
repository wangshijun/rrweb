    en:
      properties:
        gs1rn5jmxfvpxptx:
          value:
            text: Creating Product Demos and Training
            style:
              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: Generate high-fidelity, interactive product tours and tutorials from
                  recorded sessions. Instead of creating mock-ups, you can use
                  real application interactions to create realistic and
                  effective onboarding materials or marketing demos.
                style:
                  color: ""
                  fontSize: 16px
                  variant: body1
        v5utpm7bu9yvdpnq:
          value: flex-start
        kyg0hdy5uqq4gc1o:
