              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: rrweb converts the DOM and its state into a serializable data structure,
                  capturing everything needed to rebuild the page perfectly,
                  including tricky states like input values.
                style:
                  color: ""
                  fontSize: 16px
                  variant: body1
        v5utpm7bu9yvdpnq:
          value: flex-start
