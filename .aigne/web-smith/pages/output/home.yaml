          value:
            text: Automated Testing
            style:
              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: Accelerate the creation of end-to-end tests by converting recorded user
                  sessions into automated test scripts. This helps capture
                  complex user flows and edge cases that are difficult to script
                  manually, thereby improving test coverage and reliability.
