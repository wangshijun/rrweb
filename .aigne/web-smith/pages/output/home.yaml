          value: primary.main
  cebc339339a2bdc3:
    en:
      properties:
        gs1rn5jmxfvpxptx:
          value:
            text: Customer Support and Co-browsing
            style:
              fontSize: ""
              variant: h4
        e8f3k7m2n9p4q1s5:
          value: false
        9ajrz12ik7esfk1z:
          value:
            list:
              - id: item-1753379691477-fu786lae3
                type: text
                text: Power real-time customer support by viewing a user's session live (with
                  sensitive data masked). Support agents can provide accurate,
                  contextual guidance without guesswork, leading to faster
                  resolutions and a better customer experience. This is often
                  referred to as 'co-browsing.'
                style:
                  color: ""
                  fontSize: 16px
                  variant: body1
        v5utpm7bu9yvdpnq:
          value: flex-start
        kyg0hdy5uqq4gc1o:
          value: flex-start
